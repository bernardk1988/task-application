



{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>{% block title %}Todo List{% endblock %}</title>
</head>
<body>
    <div class="container p-0 bg-white rounded-3 border my-5">

        <!-- Header -->
        <div class="col-12 bg-dark rounded-3 p-2 rounded-bottom-0">
            <h2 class="text-center text-uppercase text-white">Todo List</h2>
        </div>
                {% block content %}
                {% endblock %}
        <!-- Footer -->
        <div class="container bg-dark text-center text-white p-2 rounded-3 rounded-top-0">
            <div class="row justify-content-evenly">
                <div class="col-2">GET</div>
                <div class="col-2">POST</div>
                <div class="col-2">PUT</div>
                <div class="col-2">PATCH</div>
                <div class="col-2">DELETE</div>
            </div>
        </div>

    </div>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
